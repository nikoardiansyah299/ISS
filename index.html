<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Eksplorasi 3D ISS</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div id="infoPanel">Klik modul ISS</div>
    <div id="cameraControls">
      <button id="cameraEarth" type="button" data-mode="earth">🌍 Bumi</button>
      <button id="cameraISS" type="button" data-mode="iss">🛰️ ISS</button>
      <button id="cameraSun" type="button" data-mode="sun">☀️ Matahari</button>
      <button id="cameraFreecam" type="button" data-mode="freecam">🎮 Freecam (WASD)</button>
    </div>
    <button id="orbitToggle" type="button" aria-pressed="false">Hentikan ISS Orbit</button>
    <button id="shaderToggle" type="button" data-mode="default">Shader: Default</button>
    <button id="backgroundToggle" type="button" aria-pressed="false">Gerakan bintang: Aktif</button>
  </div>

  <aside id="sidebar" aria-live="polite">
    <button id="sidebarHandle" aria-label="Toggle sidebar" class="sidebar-handle">☰</button>
    <h2>ISS & Matahari</h2>
    <div id="sunControls" class="sidebar-section">
      <label for="sunScale" class="sidebar-label">
        Ukuran Matahari
        <span id="sunScaleValue">1.0x</span>
      </label>
      <input id="sunScale" type="range" min="0.2" max="5" step="0.1" value="1">
      <label for="sunIntensity" class="sidebar-label">
        Intensitas Cahaya
        <span id="sunIntensityValue">1.1x</span>
      </label>
      <input id="sunIntensity" type="range" min="0.1" max="3" step="0.1" value="1.1">
      <button id="sunMoveToggle" type="button" aria-pressed="false" class="sidebar-button">
        Pindah Matahari: Nonaktif
      </button>
      <button id="sunResetButton" type="button" class="sidebar-button">
        Posisi Awal Matahari
      </button>
    </div>
    <p id="componentHint">Pilih komponen ISS atau klik matahari untuk kontrol.</p>

    <dl id="componentDetails">
      <div>
        <dt>Nama</dt>
        <dd id="componentName">-</dd>
      </div>
      <div>
        <dt>Keterangan</dt>
        <dd id="componentDescription">-</dd>
      </div>
    </dl>
  </aside>

  <script type="module" src="main.js"></script>
</body>
</html>
